name: Build and Push Docker Image

# ── Versioning scheme ───────────────────────────────────────────────────────
# Image tags are `<zephyr_revision>-b<build_num>` (e.g. v4.4.1-b1).
# The tag is decoupled from the Zephyr revision baked in: bump build_num when
# only tools/Dockerfile change, reset to 1 when zephyr_revision changes.
# Every push also updates:
#   - `latest`                       -> newest build overall
#   - `<zephyr_revision>` (no -bN)   -> newest build for that Zephyr revision
# See CHANGELOG.md for the release history, and `docker inspect` (OCI/com.illysky.*
# labels) for the exact tool versions baked into any given image.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag, <zephyr_revision>-b<build_num> (e.g. v4.4.1-b1)'
        required: true
        default: 'v4.4.1-b1'
      zephyr_revision:
        description: 'Zephyr revision to clone from zephyrproject-rtos/zephyr (branch, tag, or SHA)'
        required: true
        default: 'v4.4.1'

env:
  # Zephyr revision to embed in the image — update this when upgrading Zephyr.
  # Independent of the Docker image tag (see versioning scheme above).
  ZEPHYR_REVISION: v4.4.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "zephyr_revision=${{ env.ZEPHYR_REVISION }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "zephyr_revision=${{ github.event.inputs.zephyr_revision }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            zephyr_revision=${{ steps.version.outputs.zephyr_revision }}
            IMAGE_VERSION=${{ steps.version.outputs.image_tag }}
          tags: |
            ghcr.io/illysky/zephyr-docker:${{ steps.version.outputs.image_tag }}
            ghcr.io/illysky/zephyr-docker:${{ steps.version.outputs.zephyr_revision }}
            ghcr.io/illysky/zephyr-docker:latest

      # NOTE: there is deliberately no "make the package public" step here.
      # GitHub's REST/GraphQL API has no endpoint to change visibility of an
      # org-owned package (confirmed: PATCH /orgs/{org}/packages/... 404s
      # unconditionally, regardless of token scopes — see
      # https://github.com/OpenCTI-Platform/connectors/issues/5985, closed by
      # GitHub as not on their roadmap). It's a one-time manual step:
      # https://github.com/orgs/illysky/packages/container/zephyr-docker/settings
      # -> Danger Zone -> Change visibility -> Public. Only needed once ever
      # (visibility persists across future pushes/tags).
