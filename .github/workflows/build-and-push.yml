name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g. v3.3.2)'
        required: true
        default: 'v3.3.2'
      sdk_nrf_revision:
        description: 'NCS SDK revision to clone from nrfconnect/sdk-nrf (e.g. v3.3.0)'
        required: true
        default: 'v3.3.0'

env:
  # NCS SDK version to embed in the image — update this when upgrading NCS.
  # Independent of the Docker image tag (v3.3.x are our own release increments).
  SDK_NRF_REVISION: v3.3.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "sdk_nrf_revision=${{ env.SDK_NRF_REVISION }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "sdk_nrf_revision=${{ github.event.inputs.sdk_nrf_revision }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            sdk_nrf_revision=${{ steps.version.outputs.sdk_nrf_revision }}
          tags: |
            ghcr.io/illysky/nrfconnect-sdk:${{ steps.version.outputs.image_tag }}
            ghcr.io/illysky/nrfconnect-sdk:latest
