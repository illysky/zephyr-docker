name: Build and Push Docker Image

# ── Versioning scheme ───────────────────────────────────────────────────────
# Image tags are `<sdk_nrf_revision>-b<build_num>` (e.g. v3.5.0-preview1-b1).
# The tag is decoupled from the NCS revision baked in: bump build_num when
# only tools/Dockerfile change, reset to 1 when sdk_nrf_revision changes.
# Every push also updates:
#   - `latest`                        -> newest build overall
#   - `<sdk_nrf_revision>` (no -bN)    -> newest build for that NCS revision
# See CHANGELOG.md for the release history, and `docker inspect` (OCI/com.illysky.*
# labels) for the exact tool versions baked into any given image.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag, <sdk_nrf_revision>-b<build_num> (e.g. v3.5.0-preview1-b1)'
        required: true
        default: 'v3.5.0-preview1-b1'
      sdk_nrf_revision:
        description: 'NCS SDK revision to clone from nrfconnect/sdk-nrf (e.g. v3.5.0-preview1)'
        required: true
        default: 'v3.5.0-preview1'

env:
  # NCS SDK version to embed in the image — update this when upgrading NCS.
  # Independent of the Docker image tag (see versioning scheme above).
  SDK_NRF_REVISION: v3.5.0-preview1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "sdk_nrf_revision=${{ env.SDK_NRF_REVISION }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "sdk_nrf_revision=${{ github.event.inputs.sdk_nrf_revision }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            sdk_nrf_revision=${{ steps.version.outputs.sdk_nrf_revision }}
            IMAGE_VERSION=${{ steps.version.outputs.image_tag }}
          tags: |
            ghcr.io/illysky/nrfconnect-sdk:${{ steps.version.outputs.image_tag }}
            ghcr.io/illysky/nrfconnect-sdk:${{ steps.version.outputs.sdk_nrf_revision }}
            ghcr.io/illysky/nrfconnect-sdk:latest
