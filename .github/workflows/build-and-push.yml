name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (also used as sdk-nrf revision)'
        required: true
        default: 'v3.3.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            sdk_nrf_revision=${{ github.event.inputs.version }}
          tags: |
            ghcr.io/illysky/nrfconnect-sdk:${{ github.event.inputs.version }}
            ghcr.io/illysky/nrfconnect-sdk:latest
